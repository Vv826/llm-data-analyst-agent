name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # 只构建、不推送 —— 目的是验证两个 Dockerfile 没被改坏。
      # 现实中很多项目的 Dockerfile 悄悄腐化了却没人发现，这条流水线能在推送时就拦住。
      # 用 GitHub Actions 缓存镜像层，第二次之后构建基本只跑变化的部分。
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_BASE=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
