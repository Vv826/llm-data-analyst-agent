name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # CI 环境没有本地嵌入模型与向量库（两者都被 gitignore），显式关闭知识库：
      # 依赖知识库的 3 个用例会自动跳过，其余照常跑
      KB_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试（含覆盖率门槛）
        # 本地实测覆盖率约 56%，门槛定 50% 留出余量；
        # 覆盖率跌下去（比如新增功能却没补测试）会直接让 CI 变红
        run: |
          pytest -q \
            --cov=main --cov=observability --cov=codegen \
            --cov-report=term-missing \
            --cov-fail-under=50
