name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # CI 环境没有本地嵌入模型与向量库（两者都被 gitignore），显式关闭知识库：
      # 依赖知识库的 3 个用例会自动跳过，其余 67 个照常跑
      KB_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: pytest -q